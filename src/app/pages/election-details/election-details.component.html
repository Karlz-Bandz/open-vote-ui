@if (election) {
  <h2>{{ election.title }}</h2>

  <p>
    <strong>Status:</strong>
    {{ election.status }}
  </p>

  <p>
    <strong>Start date:</strong>
    {{ election.startDate }}
  </p>

  <p>
    <strong>End date:</strong>
    {{ election.endDate }}
  </p>
} @else {
  <p>Election not found.</p>
}

<button routerLink="/elections">Back to elections</button>
