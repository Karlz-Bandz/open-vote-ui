@if (election) {

<p>
    <strong>Title:</strong>
    
    @if (isEditingTitle) {
    <input type="text" [(ngModel)]="editedTitle" required />

    <button (click)="editTitle()">Save</button>
    <button (click)="cancelEditTitle()">Cancel</button>
    } @else {
    {{ election.title }}

    <button (click)="startEditTitle()">Edit</button>
    }
</p>

<p>
    <strong>Status:</strong>

    @if (isEditingStatus) {
    <select [(ngModel)]="editedStatus">
        <option value="OPENED">OPENED</option>
        <option value="FINISHED">FINISHED</option>
    </select>

    <button (click)="editStatus()">Save</button>
    <button (click)="cancelEditStatus()">Cancel</button>

    } @else {
    {{ election.status }}

    <button (click)="startEditStatus()">Edit</button>
    }
</p>

<p>
    <strong>Start date:</strong>
    {{ election.startDate }}
</p>

<p>
    <strong>End date:</strong>
    {{ election.endDate }}
</p>
} @else {
<p>Election not found.</p>
}

<button routerLink="/elections">Back to elections</button>
